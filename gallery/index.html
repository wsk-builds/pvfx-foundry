<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PVFX Foundry 演示画廊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;640&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Pixel VFX Studio · CC0</p>
      <h1>PVFX Foundry <em>演示</em></h1>
      <p class="lede" id="lede">正在读取特效目录…</p>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <label class="search">
        <span class="sr">搜索</span>
        <input id="query" type="search" placeholder="搜索名称、标签或描述" autocomplete="off">
      </label>
      <div class="seg" id="library" role="group" aria-label="资料库"></div>
      <div class="seg" id="tier" role="group" aria-label="风格"></div>
      <div class="seg" id="timing" role="group" aria-label="播放方式"></div>
      <div class="seg" id="scale" role="group" aria-label="缩放"></div>
      <button type="button" class="text-btn" id="checker" aria-pressed="true">棋盘底</button>
    </div>
  </header>
  <nav class="cats" id="cats" aria-label="分类" hidden></nav>
  <main>
    <p class="count" id="count" hidden></p>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>没有符合条件的特效。</p>
  </main>
  <dialog id="detail">
    <div class="detail-card">
      <div class="detail-stage stage" id="detail-stage">
        <canvas id="detail-canvas"></canvas>
      </div>
      <div class="detail-copy">
        <p class="eyebrow" id="detail-kicker"></p>
        <h2 id="detail-title"></h2>
        <p class="desc" id="detail-desc"></p>
        <dl id="detail-facts"></dl>
        <p class="path" id="detail-path"></p>
        <div class="detail-actions">
          <button type="button" class="text-btn" id="replay">重播</button>
          <button type="button" class="text-btn" id="close">关闭</button>
        </div>
      </div>
    </div>
  </dialog>
  <footer>
    <p>VFX from PVFX Foundry by Pixel VFX Studio。精灵图与元数据为 CC0 1.0。</p>
  </footer>
  <script src="gallery.js"></script>
</body>
</html>
